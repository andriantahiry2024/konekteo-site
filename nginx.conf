# Konekteo — site vitrine statique
# Configuration nginx principale (remplace /etc/nginx/nginx.conf de nginx:alpine).
# Traefik (Coolify) termine le TLS et proxifie vers ce conteneur sur le port 80.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    charset         utf-8;

    # Compression : le HTML, le CSS, le JS et le SVG y gagnent beaucoup
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/manifest+json image/svg+xml application/xml;

    # Durée de cache décidée par type de ressource.
    # Les noms de fichiers du dossier /assets ne changent pas : cache immuable d'un an.
    map $uri $cache_control {
        default                                    "public, max-age=0, must-revalidate";
        ~^/assets/                                 "public, max-age=31536000, immutable";
        ~^/(favicon\.svg|manifest\.webmanifest)$   "public, max-age=2592000";
    }

    server {
        listen       80 default_server;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Ces en-têtes sont hérités par tous les emplacements ci-dessous
        # (nginx ne les hérite que si l'emplacement n'en définit aucun).
        add_header Cache-Control        $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options      "SAMEORIGIN" always;
        add_header Referrer-Policy      "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy   "geolocation=(), microphone=(), camera=()" always;

        # nginx ne connaît pas l'extension .webmanifest : type déclaré explicitement
        location = /manifest.webmanifest {
            default_type  application/manifest+json;
        }

        location = /robots.txt  { access_log off; }
        location = /sitemap.xml { access_log off; }

        location ^~ /assets/ {
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

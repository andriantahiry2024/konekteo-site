# Konekteo — site vitrine statique
# Traefik (Coolify) termine le TLS et proxifie vers ce conteneur sur le port 80.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compression : le HTML/CSS/JS/SVG y gagne beaucoup, les woff2 sont déjà compressés.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # En-têtes de sécurité (TLS et redirection HTTPS sont gérés par Traefik)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Ressources : cache immuable d'un an (les noms de fichiers changent avec le contenu)
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Manifeste PWA : nginx ne connaît pas l'extension, on fixe le type explicitement
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location = /robots.txt { access_log off; }
    location = /sitemap.xml { access_log off; }

    # Pages : revalidation systématique, le contenu change souvent
    location / {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
